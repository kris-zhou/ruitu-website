[build]
  publish = "./"
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 

[forms]
  # 中文版表单
  [forms.contact-zh]
    name = "contact-zh"
    [forms.contact-zh.fields]
      [forms.contact-zh.fields.name] 
        required = true
      [forms.contact-zh.fields.email]
        required = true
      [forms.contact-zh.fields.subject]
        required = false
      [forms.contact-zh.fields.topic]
        required = false
      [forms.contact-zh.fields.message]
        required = true
      [forms.contact-zh.fields.phone]
        required = false

  # 英文版表单
  [forms.contact-en]
    name = "contact-en"
    [forms.contact-en.fields]
      [forms.contact-en.fields.name] 
        required = true
      [forms.contact-en.fields.email]
        required = true
      [forms.contact-en.fields.subject]
        required = false
      [forms.contact-en.fields.topic]
        required = false
      [forms.contact-en.fields.message]
        required = true
      [forms.contact-en.fields.phone]
        required = false

  # 韩文版表单
  [forms.contact-kr]
    name = "contact-kr"
    [forms.contact-kr.fields]
      [forms.contact-kr.fields.name] 
        required = true
      [forms.contact-kr.fields.email]
        required = true
      [forms.contact-kr.fields.subject]
        required = false
      [forms.contact-kr.fields.topic]
        required = false
      [forms.contact-kr.fields.message]
        required = true
      [forms.contact-kr.fields.phone]
        required = false

  # 联系页面表单
  [forms.contact-page]
    name = "contact-page"
    [forms.contact-page.fields]
      [forms.contact-page.fields.name] 
        required = true
      [forms.contact-page.fields.email]
        required = true
      [forms.contact-page.fields.subject]
        required = false
      [forms.contact-page.fields.message]
        required = true
      [forms.contact-page.fields.phone]
        required = false
      [forms.contact-page.fields.company]
        required = false
      [forms.contact-page.fields.privacy_consent]
        required = true

# 邮件通知设置
[[forms.contact-zh.notifications]]
  method = "email"
  from = "noreply@netlify.com"
  to = "z17790805689@outlook.com"
  subject = "瑞途贸易网站 - 新的中文联系表单提交"
  [forms.contact-zh.notifications.options]
    includeData = true
    human_readable_response = true
    spam_level = "low"
    importance = "high"

