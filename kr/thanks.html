<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감사합니다 - Ruitu Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
        }
        .thanks-container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .thanks-icon {
            font-size: 64px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .thanks-title {
            color: #333;
            margin-bottom: 20px;
        }
        .thanks-message {
            color: #666;
            margin-bottom: 30px;
        }
        .back-btn {
            padding: 10px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .back-btn:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="thanks-container">
            <i class="fas fa-check-circle thanks-icon"></i>
            <h1 class="thanks-title">감사합니다!</h1>
            <p class="thanks-message">메시지를 받았습니다. 곧 답변 드리겠습니다.</p>
            <a href="/kr/" class="back-btn">홈으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
